[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osintnet"
version = "0.1.0"
description = "A private, provenance-aware public-source investigation workspace"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.146,<1", "uvicorn>=0.54,<1", "mcp>=2.3,<3", "beautifulsoup4>=4.15,<5", "PyJWT[crypto]>=2.15,<3", "defusedxml>=0.7,<1", "geographiclib>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["osintnet*"]

[tool.setuptools.package-data]
osintnet = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
